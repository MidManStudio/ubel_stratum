name: "Ubel for Android (Termux, 64-bit and 32-bit ARM)"

# Manual only. Two jobs:
#
#  ubel      Cross-compiles the `ubel` command (which includes `ubel build`) for Android with the NDK that the runner
#            already has, and uploads it as an artifact. Download it on the phone, unzip, and run it in Termux.
#            Which artifact? In Termux run `uname -m`: `aarch64` is the 64-bit build (ubel-android-aarch64);
#            `armv8l` or `armv7l` is the 32-bit build (ubel-android-armv7), even on a phone with a 64-bit CPU (some
#            budget Samsung models ship a 32-bit userspace). Each artifact also holds termux_try.sh: run it next to
#            `ubel` and paste the output back. `ubel build` on the phone needs clang: `pkg install clang`.
#
#  examples  Builds the supported examples for the same two targets with the NDK's clang, linked statically, and runs
#            them under QEMU user mode on the runner, comparing output and exit status with the interpreter. It
#            checks that the generated code and the C runtime work with Android's C library (bionic) on both ARM
#            targets. It is NOT running on a phone: Android's own loader, SELinux and memory limits are not exercised.
#
# The logic lives in scripts under crates/ubel_llvm/scripts (termux_try.sh, run_android_qemu.sh), so it can change
# without touching this file. Not run yet on a real runner when this was written.
on:
  workflow_dispatch:
    inputs:
      api:
        description: "Android API level to build for (24 is Android 7.0; the result runs on every newer Android)"
        default: "24"
      shipped_profile:
        description: "Use the workspace release profile (LTO, one codegen unit: slow). Default: a plain release build"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  ubel:
    name: ubel for ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: android-aarch64
            artifact: ubel-android-aarch64
            rust_target: aarch64-linux-android
            clang_triple: aarch64-linux-android
          - label: android-armv7
            artifact: ubel-android-armv7
            rust_target: armv7-linux-androideabi
            clang_triple: armv7a-linux-androideabi
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: |
          rustup target add "${{ matrix.rust_target }}"
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - name: Find the Android NDK
        id: ndk
        shell: bash
        env:
          API: ${{ inputs.api }}
          TRIPLE: ${{ matrix.clang_triple }}
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ -z "$ndk" ] || [ ! -d "$bin" ]; then
            echo "::error::no Android NDK on this runner (looked at ANDROID_NDK_LATEST_HOME, ANDROID_NDK_HOME, ANDROID_NDK_ROOT)"
            exit 1
          fi
          clang="$bin/${TRIPLE}${API}-clang"
          if [ ! -x "$clang" ]; then
            echo "::error::$clang is missing (is API level $API in this NDK?)"
            ls "$bin" | grep -E 'linux-android.*-clang$' | head -n 20
            exit 1
          fi
          echo "NDK: $ndk"
          "$clang" --version | head -n 2
          echo "clang=$clang" >> "$GITHUB_OUTPUT"
          echo "ar=$bin/llvm-ar" >> "$GITHUB_OUTPUT"

      - name: Build ubel for ${{ matrix.rust_target }}
        shell: bash
        env:
          TARGET: ${{ matrix.rust_target }}
          NDK_CLANG: ${{ steps.ndk.outputs.clang }}
          NDK_AR: ${{ steps.ndk.outputs.ar }}
          SHIPPED: ${{ inputs.shipped_profile }}
        run: |
          upper="$(echo "$TARGET" | tr 'a-z-' 'A-Z_')"
          lower="$(echo "$TARGET" | tr '-' '_')"
          export "CARGO_TARGET_${upper}_LINKER=$NDK_CLANG"
          export "CC_${lower}=$NDK_CLANG" "AR_${lower}=$NDK_AR"
          if [ "$SHIPPED" != "true" ]; then
            export CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          fi
          cargo build --release -p ubel_stratum_cli --target "$TARGET"

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.rust_target }}
          LABEL: ${{ matrix.label }}
          API: ${{ inputs.api }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/ubel" dist/ubel
          cp crates/ubel_llvm/scripts/termux_try.sh dist/termux_try.sh
          ls -l dist
          {
            echo "### ubel for $LABEL (API $API)"
            echo
            echo '```'
            file dist/ubel || true
            sha256sum dist/ubel
            ls -l dist/ubel | awk '{print $5 " bytes"}'
            echo '```'
            echo
            echo "On the phone, in Termux: unzip the artifact, \`chmod +x ubel\`, then \`bash termux_try.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 30

  examples:
    name: examples for ${{ matrix.label }} under QEMU
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: android-aarch64
            clang_triple: aarch64-linux-android
            qemu: qemu-aarch64
          - label: android-armv7
            clang_triple: armv7a-linux-androideabi
            qemu: qemu-arm
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: host-ubel-llvm

      - name: QEMU
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          "${{ matrix.qemu }}" --version | head -n 1

      - name: Find the Android NDK
        id: ndk
        shell: bash
        env:
          API: ${{ inputs.api }}
          TRIPLE: ${{ matrix.clang_triple }}
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          clang="$bin/${TRIPLE}${API}-clang"
          if [ -z "$ndk" ] || [ ! -x "$clang" ]; then
            echo "::error::no usable Android NDK clang at '$clang'"
            exit 1
          fi
          "$clang" --version | head -n 2
          echo "clang=$clang" >> "$GITHUB_OUTPUT"

      - name: Build ubel-llvm for this runner (it drives the cross compiler)
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release -p ubel_llvm

      - name: Build the examples for Android and run them under QEMU
        shell: bash
        env:
          EMITTER: target/release/ubel-llvm
          CC: ${{ steps.ndk.outputs.clang }}
          QEMU: ${{ matrix.qemu }}
          LABEL: ${{ matrix.label }}
          CC_FLAGS: -static
        run: bash crates/ubel_llvm/scripts/run_android_qemu.sh
