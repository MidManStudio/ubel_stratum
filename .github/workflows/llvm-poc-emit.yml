name: Ubel LLVM PoC (Stage 1B emitter against the interpreter)

# Manual only. Builds the ubel_llvm emitter, compiles every program in
# crates/llvm_poc/examples to LLVM IR, and checks the native build against the
# interpreter at -O0 and -O2 (and under ASan + UBSan where the runner has them).
on:
  workflow_dispatch:
    inputs:
      clang:
        description: 'Compiler on the runner'
        type: choice
        default: 'clang'
        options: ['clang', 'clang-16', 'clang-17', 'clang-18']

permissions:
  contents: read

jobs:
  equiv:
    name: equivalence (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    env:
      CLANG: ${{ inputs.clang }}
      OUT_DIR: ${{ github.workspace }}/equiv-out

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -m
          "$CLANG" --version
          cargo --version

      - name: Emitter against the interpreter
        shell: bash
        run: bash crates/llvm_poc/scripts/run_equiv.sh 2>&1 | tee equiv.log

      # The report is built by a script in the repo, so it can grow without touching this file.
      - name: Job summary
        if: always()
        shell: bash
        env:
          CI_INPUTS: clang=${{ inputs.clang }}
        run: |
          bash crates/llvm_poc/scripts/ci_report_emit.sh "$OUT_DIR" equiv.log "${{ matrix.arch }}" \
            | tee equiv-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emitted IR and expected outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-poc-emit-${{ matrix.arch }}
          path: |
            equiv.log
            equiv-report.md
            equiv-out/results.tsv
            equiv-out/metrics.tsv
            equiv-out/*.ll
            equiv-out/*.expected
          if-no-files-found: warn
          retention-days: 30
