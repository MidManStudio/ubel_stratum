# crates/ubel_llvm/Cargo.toml
#
# Stage 1B of the LLVM proof of concept: emit textual LLVM IR from Ubel source.
#
# Until M1b this crate was its own workspace root, like crates/wasm_playground. It is now a member of the
# main workspace (root Cargo.toml): the `ubel` command line depends on it (`ubel build`), and
# `cargo test --workspace` runs its tests. It is not a default member, and it still depends only on the
# core and parser crates, by path. The profiles are the workspace's.
#
# Build and run it:
#   cargo build --release -p ubel_llvm        # the binary is target/release/ubel-llvm
#   bash crates/ubel_llvm/scripts/run_equiv.sh
#
# There is no libLLVM dependency: the emitter writes textual IR and clang assembles it.
[package]
name        = "ubel_llvm"
version     = "0.1.0"
edition     = "2021"
publish     = false
description = "Stage 1B of the Ubel LLVM proof of concept: emit textual LLVM IR from Ubel source"

[lib]
name = "ubel_llvm"
path = "src/lib.rs"

[[bin]]
name = "ubel-llvm"
path = "src/main.rs"

[dependencies]
ubel_stratum    = { path = "../core" }
ubel_stratum_rd = { path = "../rd_parser" }
